apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-api}
  template:
    metadata:
      labels: {app: heart-api}
    spec:
      containers:
      - name: api
        image: heart-api:local
        imagePullPolicy: Never
        ports: [{containerPort: 8000}]