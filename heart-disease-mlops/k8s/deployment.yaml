apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-api}
  template:
    metadata:
      labels: {app: heart-api}
    spec:
      containers:
      - name: api
        image: ghcr.io/2025af05063-a11y/heart-api:v3
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      imagePullSecrets:
      - name: ghcr-secret