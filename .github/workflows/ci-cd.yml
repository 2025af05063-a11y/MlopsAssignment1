name: MLOps CI/CD Pipeline

on:
  push:
    branches: ["main", "feature/develop"]
  pull_request:
    branches: ["main", "feature/develop"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heart-disease-mlops
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Check critical lint errors
        run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report other lint warnings
        run: flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        run: pytest tests/ -v

  train-and-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heart-disease-mlops
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data and train model
        run: |
          python data/download.py
          python -m src.train

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./heart-disease-mlops
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/heart-api:latest
            ghcr.io/${{ github.repository_owner }}/heart-api:v3
